# Handwritten production lines, including comments and blanks; test scopes are excluded.
max_file_lines = 800
generated_files = ["src/terminal/vt/ffi.rs"] # Generated FFI declarations, not handwritten code.
test_files = ["*_test.*"]
test_dirs = ["tests"]

# Denied on production first; exempt only while compiling test targets afterward.
production_clippy_lints = [
    "clippy::too_many_lines",
    "clippy::cognitive_complexity",
    "clippy::wildcard_imports",
    "clippy::print_stdout",
    "clippy::dbg_macro",
    "clippy::todo",
    "clippy::unimplemented",
    "clippy::get_unwrap",
    "clippy::unwrap_used",
    "clippy::too_many_arguments",
]

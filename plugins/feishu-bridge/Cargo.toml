[package]
name = "feishu-bridge"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "A durable local Feishu bot messaging bridge for macOS"
license = "MIT"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
ctrlc = { version = "3.5", features = ["termination"] }
libc = "0.2"
rusqlite = "0.32"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

[dev-dependencies]
tempfile = "3.27"

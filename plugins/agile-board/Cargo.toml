[package]
name = "agile-board"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Read-only localhost Kanban board driven by a CLI"
license = "MIT"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
ctrlc = { version = "3.5", features = ["termination"] }
libc = "0.2"
pulldown-cmark = { version = "0.13", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
tempfile = "3.27"

id = "cursor"
version = "2026.10.25.1"
min_engine_version = 3
updated_at = "2026-10-24T17:05:51Z"
aliases = ["cursor-agent"]

# Cursor --resume emits no SessionStart. Require its empty composer and
# complete model/workspace footer; working rules still win.
[[rules]]
id = "startup_prompt_idle"
managed_launch_only = true
state = "idle"
priority = 80
region = "bottom_non_empty_lines(4)"
visible_idle = true
regex = ['(?m)^[ \t]*[>→][ \t]*(?:Plan, search, build anything|Ask anything|Add a follow-up(?: — /plan to review and build)?)?[ \t]*\r?\n(?:[ \t]*▀+[ \t]*\r?\n)?[ \t\r\n]*[^\r\n]*\S[^\r\n]*\r?\n[ \t]*(?:~(?:[\\/][^\r\n]*)?|(?:[A-Za-z]:)?[\\/][^\r\n]*)\s*\z']

[[rules]]
id = "stop_hint_working"
state = "working"
priority = 100
region = "bottom_non_empty_lines(6)"
visible_working = true
contains = ["ctrl+c to stop"]

[[rules]]
id = "background_task_status_working"
state = "working"
priority = 95
region = "bottom_non_empty_lines(5)"
visible_working = true
line_regex = ['(?i)\b[1-9][0-9]*\s+background\s+tasks?\b']

[[rules]]
id = "spinner_working"
state = "working"
priority = 90
region = "bottom_non_empty_lines(8)"
visible_working = true
line_regex = ['^\s*(⬡|⬢|[\u2800-\u28FF]+)\s+\p{Alphabetic}+\w*ing\b']

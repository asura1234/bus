id = "cursor"
version = "2026.09.13.1"
min_engine_version = 1
updated_at = "2026-09-13T06:42:45Z"
aliases = ["cursor-agent"]

# Cursor Agent 2026.09.10: the native question chooser has boxed checkbox
# options and a navigation footer. Both must be live at the screen bottom;
# a previous chooser above a new prompt or working footer is not a blocker.
[[rules]]
id = "question_prompt"
state = "blocked"
priority = 310
region = "bottom_non_empty_lines(8)"
visible_blocker = true
all = [
  { line_regex = ['^\s*│\s*(?:›\s*)?\[[ x]\]\s+\S'] },
  { regex = ['(?m)^\s*│\s*↑/↓ option · ←/→ question · Space select · Enter next/submit · Esc to skip\s*│\s*\n\s*└─+┘\s*\z'] },
]

[[rules]]
id = "write_file_approval"
state = "blocked"
priority = 320
region = "bottom_non_empty_lines(8)"
visible_blocker = true
contains = ["write to this file?", "proceed (y)"]
any = [
  { contains = ["reject & propose changes"] },
  { contains = ["esc or n or p"] },
  { contains = ["add write("] },
]

[[rules]]
id = "approval_prompt"
state = "blocked"
priority = 300
region = "whole_recent"
visible_blocker = true
any = [
  { contains = ["waiting for approval", "run this command?"], any = [{ contains = ["run (once) (y)"] }, { contains = ["skip (esc or n)"] }] },
  { contains = ["(y) (enter)"] },
  { line_regex = ['(?i)^\s*allow .*\(y\)'] },
  { contains = ["keep (n)"] },
  { contains = ["skip (esc or n)"] },
  { line_regex = ['(?i)^\s*(?:→\s*)?run .*\(y\)'] },
]

[[rules]]
id = "stop_hint_working"
state = "working"
priority = 100
region = "bottom_non_empty_lines(6)"
visible_working = true
contains = ["ctrl+c to stop"]

[[rules]]
id = "background_task_status_working"
state = "working"
priority = 95
region = "bottom_non_empty_lines(5)"
visible_working = true
line_regex = ['(?i)\b[1-9][0-9]*\s+background\s+tasks?\b']

[[rules]]
id = "spinner_working"
state = "working"
priority = 90
region = "bottom_non_empty_lines(8)"
visible_working = true
line_regex = ['^\s*(⬡|⬢|[\u2800-\u28FF]+)\s+\p{Alphabetic}+\w*ing\b']

# Version-scoped Grok 1.0.5 adaptation of the legacy 0.2.101 manifest.
# Historical rules below retain their original provenance; they are not verified
# 1.0.5 permission/question evidence. Current card/frame rules are
# exercised by SYNTHETIC fixtures in tests/fixtures/grok-{dialog,composer}.
# Offline 1.0.5 evidence confirms boxed composer and Ctrl+X footer; authenticated
# permission/trust/question cards, long-paste chips and native wakes remain pending.
id = "grok"
version = "2026.10.31.3"
min_engine_version = 3
updated_at = "2026-10-31T00:00:00Z"
aliases = ["grok-build"]

# Evidence: Grok Build 0.2.101 source and live pane reads.
#
# Grok emits OSC 0 titles by default. Idle is "grok" or
# "<session> - grok". During a turn, the configured title gains a braille
# spinner and activity text. Permission prompts add "⚠ Action Required";
# that prefix blinks while the terminal is unfocused, so visible blocker
# rules outrank the generic non-idle title rule.
#
# Grok also emits OSC 9;4 progress on supported terminals. Bus retains the
# payload after "9;": "4;1;-1" while busy and "4;0;0" when idle.
#
# Working turns render one live status line directly above the prompt box:
#   "⠧ Waiting on subagent… 2.8s   13s ⇣29.7k [stop]"
#   "⠴ Explore /tmp/… + 1 more… 5.6s   19s ⇣29.7k [stop]"
# with a braille spinner and a trailing [stop] chip, plus an Esc:cancel
# footer hint. Permission prompts and ask-user-question dialogs replace the
# spinner with "◆" and draw a "┃"-guttered option list:
#   "┃  2 (○) Yes, proceed"
#   "┃  z (○) Type your answer here"
# with footer hints "1/3:select │ Ctrl+o:yolo │ Ctrl+c:cancel" (permission)
# or "Esc:unselect │ Tab:scrollback │ Shift+x:dismiss" (question dialog).
# Idle footers end with "Ctrl+.:shortcuts" and never contain "Esc:cancel".
# The startup splash draws its logo with braille characters, so working
# rules must anchor on the [stop] chip, not on a bare spinner glyph.

# Grok Build 1.0.70 startup trust screen, captured in a private scratch
# home with an untrusted project and a harmless hook. Any reliable live
# part (the question, Yes, or No) stays blocked while the version line is
# still the end of the screen. A complete composer directly above that
# version line is the live frame, so historical trust text does not block.
# A box edge alone in scrollback is not a composer.
[[rules]]
id = "startup_folder_trust"
state = "blocked"
priority = 1500
region = "bottom_non_empty_lines(20)"
visible_blocker = true
regex = ['(?m)^\s*Grok Build\s+[0-9][0-9.]*\s*\z']
any = [
  { line_regex = ['^\s*Do you trust the contents of this directory\?\s*$'] },
  { line_regex = ['^\s*Yes, proceed\s+y\s*$'] },
  { line_regex = ['^\s*No, quit\s+n\s*$'] },
]
not = [{ regex = ['(?s)\s*[╭┌]─+[╮┐]\s*\n\s*│\s*❯[^\n]*\n(?:[^\n]*\n)*?\s*[╰└][^\n]*[╯┘]\s*Grok Build\s+[0-9][0-9.]*\s*\z'] }]

# A login is never composer readiness, even with an idle OSC title.
# The title belongs to a leading control surface, never a line quoted in a
# previous reply. The last-moment observer separately checks its bounded frame.
[[rules]]
id = "login_unavailable"
state = "blocked"
priority = 1400
region = "top_non_empty_lines(1)"
visible_blocker = true
line_regex = ['(?i)^\s*(?:Log in to Grok|Sign in to Grok|Login required|Login with Grok)\s*$']

[[rules]]
id = "osc_title_blocked"
state = "blocked"
priority = 1300
region = "osc_title"
visible_blocker = true
contains = ["Action Required"]

[[rules]]
id = "option_dialog_blocked"
state = "blocked"
priority = 1200
region = "bottom_non_empty_lines(3)"
visible_blocker = true
line_regex = ['^\s*┃\s+(?:❯\s+)?[1-9a-fz]\s+(?:\([●○]\)|\[[ ✓✔x]\])\s']

[[rules]]
id = "permission_hints_blocked"
state = "blocked"
priority = 1190
region = "bottom_non_empty_lines(2)"
visible_blocker = true
contains = [":select", "ctrl+c:cancel"]

[[rules]]
id = "question_dialog_hints_blocked"
state = "blocked"
priority = 1185
region = "bottom_non_empty_lines(2)"
visible_blocker = true
contains = ["shift+x:dismiss"]

# Parked cards keep their blocker even when no selected row is visible.
[[rules]]
id = "parked_card_blocked"
state = "blocked"
priority = 1180
region = "bottom_non_empty_lines(2)"
visible_blocker = true
any = [
  { contains = ["tab/space: question"] },
  { contains = ["tab/space: permission"] },
]

[[rules]]
id = "question_editor_blocked"
state = "blocked"
priority = 1180
region = "bottom_non_empty_lines(2)"
visible_blocker = true
contains = ["enter:submit", "esc:back"]

# Grok clears its OSC busy signals while background work runs. The first
# non-empty row is pinned application chrome, where this animated chip shows
# the number of running background tasks and disappears when the count is zero.
[[rules]]
id = "background_work_chip_working"
state = "working"
priority = 1170
region = "top_non_empty_lines(1)"
visible_working = true
line_regex = ['[⋅:⸬⁙.·]\s+[1-9][0-9]*\s+│']

# Grok 1.0.70 keeps an idle OSC title ("grok") and idle progress ("4;0;0")
# during a live turn. A running task row and the [stop] status line are the
# signals that remain. They must outrank the idle OSC rules below, and stay
# under dialog and login rules so a question card is still blocked.
# Captured 2026-10-31: "▾ Tasks 1" plus "⸬ Run …", while a braille status
# line ended in "[stop]". The header count includes completed rows, so
# "Tasks N" alone is not work left. A ✓ row and Tasks 0 stay idle.
[[rules]]
id = "background_tasks_panel_working"
state = "working"
priority = 1165
region = "whole_recent"
visible_working = true
line_regex = ['^\s*⸬\s+\S']

# Grok 1.0.70 draws this above the prompt while background commands, monitors,
# loops, or subagents are still running and the turn looks idle. The companion
# wait line says sending a message interrupts that wait. A zero count does not
# match. These outrank osc_title_idle.
[[rules]]
id = "still_running_background_status_working"
state = "working"
priority = 1163
region = "whole_recent"
visible_working = true
any = [
  { line_regex = ['^\s*◎\s+waiting\s+·\s+send a message to interrupt\s*$'] },
  { line_regex = ['^\s*◎\s+[1-9][0-9]*.*still running(?:\s*·\s*send a message to interrupt)?\s*$'] },
  { line_regex = ['^\s*[1-9][0-9]*\s+\S.*still running(?:\s*·\s*send a message to interrupt)?\s*$'] },
]

# A Watchers row with a positive count is live work. The column header
# "Watchers" beside Reason/Paused/Status has no count and must not match.
[[rules]]
id = "watchers_working"
state = "working"
priority = 1161
region = "whole_recent"
visible_working = true
line_regex = ['^\s*(?:[▾▸]\s+)?Watchers\s+[1-9][0-9]*\s*$']

# Ctrl+C on "Waiting for response… [stop]" puts Bus's prompt back in the
# composer and drops [stop]. The OSC title is then the idle "grok" title, so
# this must outrank osc_title_idle. The pane stays working until that owned
# body is withdrawn; a developer draft does not start with the Bus envelope.
[[rules]]
id = "restored_bus_prompt_working"
state = "working"
priority = 1156
region = "whole_recent"
visible_working = true
line_regex = ['│\s*❯\s+\[Bus message\s']

# Mid-turn submit footer and a bare positive "N queued" line. "▾ Queued N"
# is queued_prompts_working. Zero and a transcript sentence do not match.
[[rules]]
id = "native_queue_hint_working"
state = "working"
priority = 1158
region = "whole_recent"
visible_working = true
any = [
  { line_regex = ['^\s*[1-9][0-9]*\s+queued\s*$'] },
  { line_regex = ['^.*queued, Enter to send now\s*$'] },
]

# Grok 1.0.70 queues a prompt submitted during a turn and shows it under
# Tasks as "▾ Queued N", with the same disclosure marker as "▾ Tasks N".
# N >= 1 means that submission was accepted and is waiting to run. The OSC
# title stays the idle "grok" title until that turn starts, so this must
# outrank osc_title_idle. Otherwise Bus sees idle, records no_start_hook,
# and closes the request as reply_not_captured before Grok runs it.
# Queued 0 is the empty section and must not match.
[[rules]]
id = "queued_prompts_working"
state = "working"
priority = 1162
region = "whole_recent"
visible_working = true
any = [
  { line_regex = ['^\s*[▾▸]\s+Queued\s+[1-9][0-9]*\s*$'] },
  { line_regex = ['^\s*Queued\s+[1-9][0-9]*\s*$'] },
]

[[rules]]
id = "osc_progress_working"
state = "working"
priority = 1150
region = "osc_progress"
visible_working = true
regex = ['^4;1;-1$']

[[rules]]
id = "osc_title_idle"
state = "idle"
priority = 1100
region = "osc_title"
visible_idle = true
regex = ['(?:^| - )grok$']
not = [
  { regex = ['[\x{2800}-\x{28FF}]'] },
]

# After known idle titles are excluded, any other non-empty Grok title is
# active. OSC progress remains authoritative when a custom title omits the
# spinner but the terminal supports progress reporting.
[[rules]]
id = "osc_title_working"
state = "working"
priority = 1000
region = "osc_title"
visible_working = true
regex = ['\S']

[[rules]]
id = "osc_progress_idle"
state = "idle"
priority = 950
region = "osc_progress"
visible_idle = true
regex = ['^4;0;0$']

# Above osc_title_idle (1100). Grok 1.0.70 drops the braille spinner from
# the OSC title while this [stop] line is still on screen, so a lower
# priority let Bus treat a running turn as idle and type into it.
[[rules]]
id = "spinner_status_working"
state = "working"
priority = 1160
region = "whole_recent"
visible_working = true
line_regex = ['^\s*[\x{2801}-\x{28FF}]\s.*\[stop\]\s*$']

# Above osc_title_idle. A Thinking row whose only cancel hint is Esc:cancel
# has no [stop] chip. Dialog footers stay blocked at the higher priorities.
[[rules]]
id = "esc_cancel_hints_working"
state = "working"
priority = 1155
region = "bottom_non_empty_lines(2)"
visible_working = true
contains = ["esc:cancel"]
any = [
  { contains = ["ctrl+.:shortcuts"] },
  { contains = ["ctrl+x:shortcuts"] },
]

# Pre-0.2.x working chrome kept for older Grok Build releases.
[[rules]]
id = "waiting_tool_working"
state = "working"
priority = 120
region = "whole_recent"
visible_working = true
any = [
  { all = [{ contains = ["ctrl+c:cancel", "ctrl+enter:interject"] }, { contains = ["waiting"] }] },
  { line_regex = ['^\s*[\x{2801}-\x{28FF}]\s+(Run|Read|Search|List)\b'] },
]

# Offline 1.0.5 shows Ctrl+X on non-Kitty terminals. A normal-mode
# footer and complete box are required; a bare hint is not a ready composer.
[[rules]]
id = "prompt_hints_idle"
state = "idle"
priority = 100
region = "whole_recent"
visible_idle = true
regex = ['(?ms)^\s*[╭┌]─+[╮┐]\s*\n\s*│\s*❯[^\n]*\n(?:[^\n]*\n)*?\s*(?:[╰└]─+[╯┘]|╰─+ Grok [A-Za-z0-9.() -]+ ─╯)\s*\n[^\n]*Shift\+Tab:mode[^\n]*Ctrl\+[x.]:shortcuts\s*$']

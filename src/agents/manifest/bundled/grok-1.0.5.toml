# Version-scoped Grok 1.0.5 adaptation of the legacy 0.2.101 manifest.
# Historical rules below retain their original provenance; they are not verified
# 1.0.5 permission/question evidence. Current card/frame rules are
# exercised by SYNTHETIC fixtures in tests/fixtures/grok-{dialog,composer}.
# Offline 1.0.5 evidence confirms boxed composer and Ctrl+X footer; authenticated
# permission/trust/question cards, long-paste chips and native wakes remain pending.
id = "grok"
version = "2026.10.22.1"
min_engine_version = 3
updated_at = "2026-10-22T00:00:00Z"
aliases = ["grok-build"]

# Evidence: Grok Build 0.2.101 source and live pane reads.
#
# Grok emits OSC 0 titles by default. Idle is "grok" or
# "<session> - grok". During a turn, the configured title gains a braille
# spinner and activity text. Permission prompts add "⚠ Action Required";
# that prefix blinks while the terminal is unfocused, so visible blocker
# rules outrank the generic non-idle title rule.
#
# Grok also emits OSC 9;4 progress on supported terminals. Bus retains the
# payload after "9;": "4;1;-1" while busy and "4;0;0" when idle.
#
# Working turns render one live status line directly above the prompt box:
#   "⠧ Waiting on subagent… 2.8s   13s ⇣29.7k [stop]"
#   "⠴ Explore /tmp/… + 1 more… 5.6s   19s ⇣29.7k [stop]"
# with a braille spinner and a trailing [stop] chip, plus an Esc:cancel
# footer hint. Permission prompts and ask-user-question dialogs replace the
# spinner with "◆" and draw a "┃"-guttered option list:
#   "┃  2 (○) Yes, proceed"
#   "┃  z (○) Type your answer here"
# with footer hints "1/3:select │ Ctrl+o:yolo │ Ctrl+c:cancel" (permission)
# or "Esc:unselect │ Tab:scrollback │ Shift+x:dismiss" (question dialog).
# Idle footers end with "Ctrl+.:shortcuts" and never contain "Esc:cancel".
# The startup splash draws its logo with braille characters, so working
# rules must anchor on the [stop] chip, not on a bare spinner glyph.

# A login is never composer readiness, even with an idle OSC title.
# The title belongs to a leading control surface, never a line quoted in a
# previous reply. The last-moment observer separately checks its bounded frame.
[[rules]]
id = "login_unavailable"
state = "blocked"
priority = 1400
region = "top_non_empty_lines(1)"
visible_blocker = true
line_regex = ['(?i)^\s*(?:Log in to Grok|Sign in to Grok|Login required|Login with Grok)\s*$']

[[rules]]
id = "osc_title_blocked"
state = "blocked"
priority = 1300
region = "osc_title"
visible_blocker = true
contains = ["Action Required"]

[[rules]]
id = "option_dialog_blocked"
state = "blocked"
priority = 1200
region = "bottom_non_empty_lines(3)"
visible_blocker = true
line_regex = ['^\s*┃\s+(?:❯\s+)?[1-9a-fz]\s+(?:\([●○]\)|\[[ ✓✔x]\])\s']

[[rules]]
id = "permission_hints_blocked"
state = "blocked"
priority = 1190
region = "bottom_non_empty_lines(2)"
visible_blocker = true
contains = [":select", "ctrl+c:cancel"]

[[rules]]
id = "question_dialog_hints_blocked"
state = "blocked"
priority = 1185
region = "bottom_non_empty_lines(2)"
visible_blocker = true
contains = ["shift+x:dismiss"]

# Parked cards keep their blocker even when no selected row is visible.
[[rules]]
id = "parked_card_blocked"
state = "blocked"
priority = 1180
region = "bottom_non_empty_lines(2)"
visible_blocker = true
any = [
  { contains = ["tab/space: question"] },
  { contains = ["tab/space: permission"] },
]

[[rules]]
id = "question_editor_blocked"
state = "blocked"
priority = 1180
region = "bottom_non_empty_lines(2)"
visible_blocker = true
contains = ["enter:submit", "esc:back"]

# Grok clears its OSC busy signals while background work runs. The first
# non-empty row is pinned application chrome, where this animated chip shows
# the number of running background tasks and disappears when the count is zero.
[[rules]]
id = "background_work_chip_working"
state = "working"
priority = 1170
region = "top_non_empty_lines(1)"
visible_working = true
line_regex = ['[⋅:⸬⁙.·]\s+[1-9][0-9]*\s+│']

[[rules]]
id = "osc_progress_working"
state = "working"
priority = 1150
region = "osc_progress"
visible_working = true
regex = ['^4;1;-1$']

[[rules]]
id = "osc_title_idle"
state = "idle"
priority = 1100
region = "osc_title"
visible_idle = true
regex = ['(?:^| - )grok$']
not = [
  { regex = ['[\x{2800}-\x{28FF}]'] },
]

# After known idle titles are excluded, any other non-empty Grok title is
# active. OSC progress remains authoritative when a custom title omits the
# spinner but the terminal supports progress reporting.
[[rules]]
id = "osc_title_working"
state = "working"
priority = 1000
region = "osc_title"
visible_working = true
regex = ['\S']

[[rules]]
id = "osc_progress_idle"
state = "idle"
priority = 950
region = "osc_progress"
visible_idle = true
regex = ['^4;0;0$']

[[rules]]
id = "spinner_status_working"
state = "working"
priority = 200
region = "whole_recent"
visible_working = true
line_regex = ['^\s*[\x{2801}-\x{28FF}]\s.*\[stop\]\s*$']

[[rules]]
id = "esc_cancel_hints_working"
state = "working"
priority = 190
region = "bottom_non_empty_lines(2)"
visible_working = true
contains = ["esc:cancel"]
any = [
  { contains = ["ctrl+.:shortcuts"] },
  { contains = ["ctrl+x:shortcuts"] },
]

# Pre-0.2.x working chrome kept for older Grok Build releases.
[[rules]]
id = "waiting_tool_working"
state = "working"
priority = 120
region = "whole_recent"
visible_working = true
any = [
  { all = [{ contains = ["ctrl+c:cancel", "ctrl+enter:interject"] }, { contains = ["waiting"] }] },
  { line_regex = ['^\s*[\x{2801}-\x{28FF}]\s+(Run|Read|Search|List)\b'] },
]

# Offline 1.0.5 shows Ctrl+X on non-Kitty terminals. A normal-mode
# footer and complete box are required; a bare hint is not a ready composer.
[[rules]]
id = "prompt_hints_idle"
state = "idle"
priority = 100
region = "whole_recent"
visible_idle = true
regex = ['(?ms)^\s*[╭┌]─+[╮┐]\s*\n\s*│\s*❯[^\n]*\n(?:[^\n]*\n)*?\s*(?:[╰└]─+[╯┘]|╰─+ Grok [A-Za-z0-9.() -]+ ─╯)\s*\n[^\n]*Shift\+Tab:mode[^\n]*Ctrl\+[x.]:shortcuts\s*$']

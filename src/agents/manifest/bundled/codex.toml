id = "codex"
version = "2026.10.25.2"
min_engine_version = 3
updated_at = "2026-10-24T18:04:42Z"

# "Update now" replaces the Codex UI with the package manager it runs, while the
# node launcher keeps the pane's process looking like Codex. Without this rule
# the updater's output fell through to the idle fallback (or the stale OSC
# title), so Bus showed an agent that was gone as Idle. Working, so queued
# messages wait through a slow install instead of expiring from the queue. A
# relaunched Codex draws its prompt below this text, which ends the match.
[[rules]]
id = "self_update_running"
state = "working"
priority = 1200
region = "after_last_prompt_marker"
line_regex = ['^\s*Updating Codex via `[^`]+`']

[[rules]]
id = "osc_title_blocked"
state = "blocked"
priority = 1100
region = "osc_title"
visible_blocker = true
contains = ["Action Required"]

# 折叠的 "? N question / to answer" 会留在屏幕上，Codex 仍把标题写成 Action Required。
# 同时有 "Working (... esc to interrupt)" 或 "Waiting for background terminal
# (... esc to interrupt)" 时，这一轮还在跑。
[[rules]]
id = "activity_with_stale_question"
state = "working"
priority = 1150
region = "whole_recent"
visible_working = true
all = [
  { line_regex = ['(?i)^[•◦]\s+\S.*esc to interrupt'] },
  { regex = ['(?m)^\s*\?\s+[0-9]+\s+questions?\s*$'] },
  { contains = ["to answer"] },
]
not = [
  { contains = ["press enter to confirm or esc to cancel"] },
  { contains = ["enter to submit answer"] },
  { contains = ["enter to submit all"] },
  { contains = ["allow command?"] },
  { contains = ["press enter to continue"] },
  { contains = ["■ Conversation interrupted"] },
  { contains = ["↑/↓ to scroll"] },
]

[[rules]]
id = "osc_title_working"
state = "working"
priority = 1050
region = "osc_title"
visible_working = true
regex = ['(?:^| )[⠋⠙⠹⠸⠼⠴⠦⠧⠇⠏](?: |$)']

# Codex has no SessionStart or rollout before its first prompt. Its startup
# prompt can already be ready while OSC still carries a bootstrap spinner.
# Require all three live footer lines, and never override visible working text.
# Codex 0.164 may leave one blank row between the composer and model.
[[rules]]
id = "startup_prompt_idle"
managed_launch_only = true
state = "idle"
priority = 1080
region = "whole_recent"
visible_idle = true
regex = ['(?m)^[ \t]*›[ \t]*{{codex_empty_composer}}[ \t]*\r?\n(?:[ \t]*\r?\n)?[ \t]*GPT-[^\r\n]+·[^\r\n]+\r?\n[ \t]*\? for shortcuts[^\r\n]*\s*\z']
not = [{ line_regex = ['(?i)^\s*[•◦]\s+\S.*esc to interrupt'] }]

[[rules]]
id = "transcript_viewer"
state = "unknown"
priority = 1000
region = "after_last_prompt_marker"
skip_state_update = true
contains = ["↑/↓ to scroll", "pgup/pgdn to", "home/end to jump", "q to quit"]
any = [
  { contains = ["esc to edit prev"] },
  { contains = ["esc/← to edit prev"] },
]

[[rules]]
id = "screen_working_fallback"
state = "working"
priority = 500
# The complete composer, model and shortcuts footer occupies three nonempty rows.
region = "bottom_non_empty_lines(4)"
visible_working = true
line_regex = ['^[•◦]\s+Working \([^)]*esc to interrupt\)(?: · .*)?$']
not = [{ contains = ["■ Conversation interrupted"] }]

[[rules]]
id = "osc_title_idle"
state = "idle"
priority = 100
region = "osc_title"
visible_idle = true
regex = ['\S']
not = [
  { regex = ['(?:^| )[⠋⠙⠹⠸⠼⠴⠦⠧⠇⠏](?: |$)'] },
  { contains = ["Action Required"] },
]

id = "kimi"
version = "2026.11.01.1"
min_engine_version = 1
updated_at = "2026-11-01T00:00:00Z"
aliases = ["kimi-code", "kimi code"]

[[rules]]
id = "current_trust_panel"
state = "blocked"
priority = 450
region = "whole_recent"
visible_blocker = true
contains = ["Trust this folder?", "Trust and continue"]

[[rules]]
id = "current_cache_expiry_panel"
state = "blocked"
priority = 445
region = "whole_recent"
visible_blocker = true
contains = ["Cache expired", "Don't ask me again"]

[[rules]]
id = "current_approval_panel"
state = "blocked"
priority = 400
region = "whole_recent"
visible_blocker = true
contains = ["↵ confirm"]
any = [
  { contains = ["run this command?"] },
  { contains = ["write this file?"] },
  { contains = ["apply these edits?"] },
  { contains = ["stop this task?"] },
  { contains = ["ready to build with this plan?"] },
  { line_regex = ['(?i)^\s*▶?\s*approve .*\?$'] },
]
all = [
  { contains = [" choose"] },
  { any = [{ contains = ["approve"] }, { contains = ["reject"] }, { contains = ["revise"] }] },
]

[[rules]]
id = "question_panel"
state = "blocked"
priority = 390
region = "whole_recent"
visible_blocker = true
contains = ["↑↓ select", "esc cancel"]
line_regex = ['^\s*question\s*$', '^\s*\? ']
any = [
  { contains = ["↵ choose"] },
  { contains = ["↵ toggle"] },
  { contains = ["↵ save"] },
]

[[rules]]
id = "legacy_approval_panel"
state = "blocked"
priority = 300
region = "whole_recent"
contains = ["requesting approval", "reject"]
any = [
  { contains = ["approve once"] },
  { contains = ["approve for this session"] },
]
all = [
  { any = [{ contains = ["1/2/3/4 choose"] }, { contains = ["↵ confirm"] }] },
]

[[rules]]
id = "background_agent_status_working"
state = "working"
priority = 120
region = "bottom_non_empty_lines(3)"
visible_working = true
line_regex = ['(?i)\bkimi[-\w.]*\s+thinking\b.*\[[1-9][0-9]*\s+agents?\s+running\]']

[[rules]]
id = "moon_spinner_working"
state = "working"
priority = 100
region = "whole_recent"
visible_working = true
line_regex = ['^\s*(🌕|🌖|🌗|🌘|🌑|🌒|🌓|🌔)(\s*·\s*Tip: .*)?\s*$']

[[rules]]
id = "braille_spinner_working"
state = "working"
priority = 90
region = "whole_recent"
visible_working = true
line_regex = ['(?i)^\s*[\u2800-\u28FF]+\s*(thinking(?:\.\.\.|…)|working(?:\.\.\.|…)|using )']

[[rules]]
id = "footer_tasks_running_working"
state = "working"
priority = 85
region = "bottom_non_empty_lines(5)"
visible_working = true
line_regex = ['(?i)\[[1-9][0-9]*\s+tasks?\s+running\]']

[[rules]]
id = "footer_running_command_working"
state = "working"
priority = 84
# The live tool header sits above the composer. A live run also prints
# "Approved:" and a spinner tip, so the header is about the eighth
# non-empty line. The same words can be a finished reply. This rule is
# not proof of work by itself: the main wire's turn decides when available,
# including settled replies with a command suffix or bold text. Without wire,
# require both the `· $ command` suffix and bold styling of the live header.
region = "bottom_non_empty_lines(12)"
visible_working = true
line_regex = ['(?i)^\s*(?:[●•]\s+)?running a command(?:\s*·.*)?\s*$']

[[rules]]
id = "footer_steer_working"
state = "working"
priority = 83
region = "bottom_non_empty_lines(5)"
visible_working = true
line_regex = ['(?i)ctrl-s to steer', '↑ to edit']

[[rules]]
id = "current_empty_composer"
state = "idle"
priority = 70
# A turn summary under the box (`✻ Thinking N times`) pushes the empty
# composer one line above the old five-line window. Six still sees it.
region = "bottom_non_empty_lines(6)"
visible_idle = true
contains = ["context:"]
line_regex = ['^\s*│ >\s*│\s*$']

id = "codex"
version = "2026.09.13.3"
min_engine_version = 3
updated_at = "2026-09-13T06:55:22Z"

[[rules]]
id = "osc_title_blocked"
state = "blocked"
priority = 1100
region = "osc_title"
visible_blocker = true
contains = ["Action Required"]

[[rules]]
id = "osc_title_working"
state = "working"
priority = 1050
region = "osc_title"
visible_working = true
regex = ['(?:^| )[⠋⠙⠹⠸⠼⠴⠦⠧⠇⠏](?: |$)']

[[rules]]
id = "transcript_viewer"
state = "unknown"
priority = 1000
region = "after_last_prompt_marker"
skip_state_update = true
contains = ["↑/↓ to scroll", "pgup/pgdn to", "home/end to jump", "q to quit"]
any = [
  { contains = ["esc to edit prev"] },
  { contains = ["esc/← to edit prev"] },
]

[[rules]]
id = "trust_directory"
state = "blocked"
priority = 950
region = "bottom_non_empty_lines(20)"
visible_blocker = true
# Shell launch text may precede the chooser. Require its live controls and footer.
all = [
  { line_regex = ['^> You are in [^\r\n]+$'] },
  { regex = ['(?s)Do\s+you\s+trust\s+the\s+contents\s+of\s+this\s+directory\?'] },
  { line_regex = ['^\s*[›❯]?\s*1\.\s*Yes, continue\s*$', '^\s*[›❯]?\s*2\.\s*No, quit\s*$'] },
  { regex = ['Press enter to continue\s*\z'] },
]

[[rules]]
id = "startup_update"
state = "blocked"
priority = 950
region = "bottom_non_empty_lines(20)"
visible_blocker = true
contains = ["Update available!", "Update now"]
regex = ['Skip\s+until\s+next\s+version', 'Press enter to continue\s*\z']

# Codex 0.154.0 hook UIs consume terminal input while their controls are open.
# Require both the chooser/table and its footer, not historical warning text.
[[rules]]
id = "hooks_startup_review"
state = "blocked"
priority = 950
region = "bottom_non_empty_lines(20)"
visible_blocker = true
all = [
  { line_regex = ['^\s*Hooks need review\s*$'] },
  { line_regex = ['^\s*[›❯]?\s*1\.\s*Review hooks\s*$', '^\s*[›❯]?\s*2\.\s*Trust all and continue\s*$', '^\s*[›❯]?\s*3\.\s*Continue without trusting \(hooks won.t run\)\s*$'] },
  { regex = ['(?m)^\s*Press enter to confirm or esc to go back\s*\z'] },
]

[[rules]]
id = "hooks_table_review"
state = "blocked"
priority = 950
region = "bottom_non_empty_lines(20)"
visible_blocker = true
all = [
  { line_regex = ['^\s*Hooks\s*$'] },
  { any = [
    { line_regex = ['^\s*Event\s+Installed\s+Active\s+Review\s+Description\s*$'], regex = ['(?m)^\s*Press t to trust all; enter to review hooks; esc to close\s*\z'] },
    { line_regex = ['^\s*Event\s+Installed\s+Active\s+Description\s*$'], regex = ['(?m)^\s*Press enter to view hooks; esc to close\s*\z'] },
  ] },
]

[[rules]]
id = "live_strong_blocker"
state = "blocked"
priority = 900
region = "after_last_prompt_marker"
visible_blocker = true
any = [
  { contains = ["press enter to confirm or esc to cancel"] },
  { contains = ["enter to submit answer"] },
  { contains = ["enter to submit all"] },
  { contains = ["allow command?"] },
]

[[rules]]
id = "weak_blocker"
state = "blocked"
priority = 600
region = "whole_recent_without_current_prompt_marker"
any = [
  { contains = ["[y/n]"] },
  { contains = ["yes (y)"] },
  { contains = ["do you want to"], any = [{ contains = ["yes"] }, { contains = ["❯"] }] },
  { contains = ["would you like to"], any = [{ contains = ["yes"] }, { contains = ["❯"] }] },
]

[[rules]]
id = "screen_working_fallback"
state = "working"
priority = 500
region = "bottom_non_empty_lines(3)"
visible_working = true
line_regex = ['^[•◦]\s+Working \([^)]*esc to interrupt\)(?: · .*)?$']
not = [{ contains = ["■ Conversation interrupted"] }]

[[rules]]
id = "osc_title_idle"
state = "idle"
priority = 100
region = "osc_title"
visible_idle = true
regex = ['\S']
not = [
  { regex = ['(?:^| )[⠋⠙⠹⠸⠼⠴⠦⠧⠇⠏](?: |$)'] },
  { contains = ["Action Required"] },
]
